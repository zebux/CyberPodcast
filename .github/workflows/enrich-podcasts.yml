name: Enrich podcasts

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/enrich-podcasts.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: podcast-http-cache-${{ github.run_id }}
          restore-keys: |
            podcast-http-cache-

      - name: Enrich podcasts
        run: python scripts/enrich_podcasts.py

      - name: Render HTML page
        run: python scripts/render_html.py

      - name: Validate output
        run: |
          python - <<'PY'
          import yaml
          with open("podcasts.yaml", encoding="utf-8") as f:
              data = yaml.safe_load(f)
          assert data["podcasts"], "podcasts.yaml est vide"
          ids = [p["id"] for p in data["podcasts"]]
          assert len(ids) == len(set(ids)), "identifiants dupliqués"
          for p in data["podcasts"]:
              assert p["status"] in {"active", "slow", "archived"}, p
              assert p["language"] in {"fr", "en"} or p["language"], p
          print(f"OK: {len(ids)} podcasts")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcasts.yaml docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "chore: enrich podcasts.yaml and refresh page"
          git push

  deploy:
    needs: enrich
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
